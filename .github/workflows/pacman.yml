name: Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"  # Atualiza todo dia à meia-noite
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Pac-Man graph
        uses: platane/snk@v3
        with:
          github_user_name: iscaio
          outputs: |
            pacman-contribution-graph.svg
            pacman-contribution-graph-dark.svg

      - name: Push to output branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add pacman-contribution-graph*.svg
          git commit -m "Update Pac-Man Contribution Graph" || echo "No changes to commit"
          git push -u origin HEAD:output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
